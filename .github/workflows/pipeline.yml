name: ML Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ============================================
  # JOB 1: SETUP AND DATA VALIDATION
  # ============================================
  setup:
    name: Setup & Validate Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate data schema
        run: |
          python -c "
          import pandas as pd
          import os
          if os.path.exists('data/engine_data.csv'):
              df = pd.read_csv('data/engine_data.csv')
              print(f'✓ Data validation passed: {df.shape}')
          else:
              print('⚠ Data file not found, skipping validation')
          "

      - name: Run unit tests
        run: |
          if [ -d tests/ ]; then pytest tests/ -v --cov=src --cov-report=xml; else echo "No tests directory found"; fi

  # ============================================
  # JOB 2: FEATURE ENGINEERING & PREPROCESSING
  # ============================================
  preprocessing:
    name: Feature Engineering
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run feature engineering
        run: |
          python src/feature_engineering.py

      - name: Validate engineered features
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('data/features_engineered.csv')
          print(f'✓ Feature engineering successful: {df.shape}')
          print(f'✓ Engineered features: {list(df.columns[-3:])}')
          "

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: engineered-features
          path: data/features_engineered.csv

  # ============================================
  # JOB 3: MODEL TRAINING
  # ============================================
  training:
    name: Train ML Models
    runs-on: ubuntu-latest
    needs: preprocessing

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download preprocessed data
        uses: actions/download-artifact@v4
        with:
          name: engineered-features
          path: data/

      - name: Train baseline models
        run: |
          python src/train_models.py

      - name: Train best model (XGBoost)
        run: |
          python src/train_best_model.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/best_model.pkl

  # ============================================
  # JOB 4: MODEL EVALUATION
  # ============================================
  evaluation:
    name: Evaluate Model Performance
    runs-on: ubuntu-latest
    needs: training

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: engineered-features
          path: data/

      - name: Run evaluation
        run: |
          python src/evaluate_model.py

      - name: Check metrics threshold
        run: |
          python -c "
          import json
          with open('reports/metrics.json') as f:
              metrics = json.load(f)
          f2_score = metrics.get('F2_Score', 0)
          assert f2_score >= 0.75, f'F2-Score below threshold: {f2_score}'
          print(f'✓ Model meets quality threshold (F2-Score: {f2_score})')
          "

      - name: Generate report
        run: |
          python src/generate_report.py

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/

  # ============================================
  # JOB 5: PUSH TO HUGGING FACE
  # ============================================
  deployment:
    name: Deploy to Hugging Face
    runs-on: ubuntu-latest
    needs: evaluation
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install huggingface-hub

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Push model to HF Hub
        run: |
          python push_to_huggingface.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Verify deployment
        run: |
          echo "✓ Model deployed to Hugging Face"
          echo "✓ Space updated automatically"

  # ============================================
  # JOB 6: UPDATE MAIN BRANCH
  # ============================================
  finalize:
    name: Update Main Branch
    runs-on: ubuntu-latest
    needs: deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && success()

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Merge model updates from develop to main'
          title: 'Automated Model Update from develop'
          body: |
            Automated pull request for model updates.

            - Model training completed
            - Evaluation passed all thresholds
            - Ready for production deployment
          branch: model-update-${{ github.run_number }}
          base: main
          head: develop
